id: IE/DPC
terms:
- title: Data Protection Commission, re-use of public sector information
  url: https://www.dataprotection.ie/en/who-we-are/corporate-governance/re-use-public-sector-information
- title: 'Department of Public Expenditure and Reform, Circular 12/2016: Licence for Re-Use of Public Sector Information'
  url: https://www.centralbank.ie/docs/default-source/ftr/ftr-1-3-licence.pdf
date_read: 2026-11-24
read_by: Fraser Matcham
review_by: 2027-05-24
licence:
  name: Irish standard licence for re-use of public sector information (Creative Commons Attribution 4.0 International)
  url: https://www.dataprotection.ie/en/who-we-are/corporate-governance/re-use-public-sector-information
commercial_use: allowed
assistant_reading: permitted
storing_text: permitted
linking: permitted
attribution_line: Data Protection Commission guidance and decisions from dataprotection.ie. © Data Protection Commission. Contains Irish Public Sector Information licensed under a Creative Commons Attribution 4.0 International (CC BY 4.0) licence. Extract only.
status_lines:
- The Data Protection Commission does not certify that the information is up to date or error free.
- Extract only, where a single section or a capped passage is shown.
conditions:
- Acknowledge the source and the publisher's copyright where the information is supplied to others.
- Reproduce the information accurately and do not use it in a misleading way.
- Do not use it for the principal purpose of advertising or promoting a particular product or service, or for illegal, immoral, fraudulent or dishonest purposes.
- Decisions and inquiry reports can name organisations and individuals. Personal data is outside the licence, so those wait for the data protection check (TEC-763).
not_covered:
- Material marked as another owner's
- Personal data
evidence: The 2 pages were opened in a browser and read on 24 November 2026 by an AI assistant working for the reader. Filing of saved copies is tracked on TEC-746.
notes: The DPC's page says the information on its website is its copyright unless otherwise indicated, may be re-used free of charge in any format, and is subject to the latest PSI licence on data.gov.ie. Circular 12/2016 makes CC BY 4.0 the standard Irish PSI licence. The attribution line uses the standard statement for Irish public sector information. An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record and approved the attribution line on 24 November 2026.
