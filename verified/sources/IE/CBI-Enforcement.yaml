- Material marked as another owner's
evidence: The 3 pages were opened in a browser and read on 24 November 2026 by an AI assistant working for the reader. Filing of saved copies is tracked on TEC-746.
notes: Verified and held at link only. In legal-sources this source is the Central Bank of Ireland's enforcement actions. The Bank's page says the information on its website is its copyright unless expressly indicated otherwise, and may be re-used without prior permission under the licence it links, Circular 12/2016. The licence allows commercial re-use, but it does not cover personal data, so whether an assistant may read these is left open here and no attribution line is set. An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record on 24 November 2026.
