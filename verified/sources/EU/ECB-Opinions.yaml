status_lines:
- Only ECB legal instruments as published in the Official Journal of the European Union are deemed authentic.
- Extract only, where a single section or a capped passage is shown.
conditions:
- Reproduced accurately, with the ECB cited as the source.
- Where the material is included in something that is sold, buyers must be told, before they pay and each time they reach the material, that it can be obtained free of charge from the ECB's website.
- Any change made to the material, such as adjusting data, must be stated.
- Documents that bear their authors' names, such as ECB Working Papers, need the ECB's or the authors' written authorisation before republication.
- Only ECB legal instruments as published in the Official Journal of the European Union are deemed authentic.
