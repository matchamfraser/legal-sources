id: EU/ECJ-Tax
terms:
- title: EUR-Lex legal notice (disclaimer and copyright notice)
  url: https://eur-lex.europa.eu/content/legal-notice/legal-notice.html
- title: Publications Office of the European Union, copyright
  url: https://op.europa.eu/en/web/about-us/legal-notices/publications-office-of-the-european-union-copyright
- title: EUR-Lex webservice (limits)
  url: https://eur-lex.europa.eu/content/help/data-reuse/webservice.html
date_read: 2026-11-24
read_by: Fraser Matcham
review_by: 2027-05-24
licence:
  name: EUR-Lex legal notice; reuse policy based on Commission Decision 2011/833/EU
  url: https://eur-lex.europa.eu/content/legal-notice/legal-notice.html
commercial_use: allowed
assistant_reading: permitted
storing_text: permitted
linking: permitted
status_lines:
- Linked, not reproduced.
- For case law, only the versions published in the European Court Reports are deemed official sources.
conditions:
- 'Held at details and a link until the data protection assessment (TEC-763) accepts reading the text: the terms permit it, but judgments and opinions name parties and other people.'
- Additional rights may need clearing where content depicts identifiable private individuals or includes third-party works, and content not owned by the EU may need its rights holders' permission.
- 'Unless otherwise specified. Some documents have special conditions of use, mentioned in the respective document: check each document.'
- The Publications Office's copyright page says that questions about "the conditions under which the content of the CELLAR ... may be re-used" go to op-copyright@publications.europa.eu. The documents in CELLAR are the ones the EUR-Lex notice covers, and the record relies on that notice.
- 'Access: the EUR-Lex webservice has a daily call limit and, from 1 January 2026, returns at most 10,000 results a search; large volumes go through the mass download services or the CELLAR API and SPARQL endpoint.'
not_covered:
- The EUR-Lex logo, which needs the prior consent of the Publications Office
- Software or documents covered by industrial property rights, such as patents, trademarks, registered designs, logos and names
evidence: The pages were opened in a browser and read on 24 November 2026 by an AI assistant working for the reader. Filing of saved copies is tracked on TEC-746.
notes: 'Verified and held at link only, as every case-law source is until TEC-763. In legal-sources this source is the Court of Justice''s tax judgments, collected from EUR-Lex and the Publications Office''s metadata service. The EUR-Lex legal notice says: "Unless otherwise specified, you can re-use the legal documents published in EUR-Lex for commercial or non-commercial purposes." It sets no limit on automated reading or analysis, so assistant_reading is permitted on the terms (TEC-745). An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record on 24 November 2026.'
signal: yellow
