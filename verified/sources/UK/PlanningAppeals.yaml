notes: Verified and held at link only. In legal-sources this source is the Planning Inspectorate's appeal decisions, collected from its appeals casework portal. The portal's terms say it is published under the Open Government Licence v3.0, with exceptions. The licence does not cover the personal data in a decision, so whether an assistant may read these is left open here and no attribution line is set. An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record on 20 November 2026.
