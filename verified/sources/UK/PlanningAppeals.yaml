conditions:
- The decisions are about named appellants and particular properties, and personal data is outside the Open Government Licence. Nothing is read from them until the data protection check is done (TEC-763).
- Maps, plans and drawings on the portal are made available under section 47 of the Copyright, Designs and Patents Act 1988. Further copies need the copyright owner's permission, and Ordnance Survey maps need an Ordnance Survey licence.
- Some information on the portal is excluded from the licence, and third parties' copyright must be respected.
- A link is allowed if it is fair and legal, suggests no association, approval or endorsement, is placed only on a website the linker owns, and does not frame the portal. The permission can be withdrawn without notice.
not_covered:
- Personal data in the information
- Logos
- Maps, plans and drawings made available under section 47 of the Copyright, Designs and Patents Act 1988
- Third party rights the information provider is not authorised to license
