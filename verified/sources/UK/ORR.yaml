attribution_line: Office of Rail and Road publications from GOV.UK (www.gov.uk). Contains public sector information licensed under the Open Government Licence v3.0. Extract only. GOV.UK has the current version.
status_lines:
- GOV.UK can change or withdraw a page at any time, and says the most up to date version of its content is always on GOV.UK.
- 'GOV.UK says it does not publish advice: get professional or specialist advice before acting on the content.'
- Extract only, where a single section or a capped passage is shown.
conditions:
- 'Only what GOV.UK publishes under the Open Government Licence. The footer says "except where otherwise stated", and content that is not Crown copyright is usually credited to its author: check each document, and leave out anything credited to someone else.'
- 'Automated access: GOV.UK says the site may be scraped if its robots.txt is respected, and that requests are rate limited. Its Content API may be used by anyone for any purpose.'
- GOV.UK welcomes links. Its permission is needed to charge users for following one, or to say a site is associated with or endorsed by GOV.UK or a department.
not_covered:
- Personal data in the information
- Departmental or public sector logos, crests and the Royal Arms, except where they form an integral part of a document or dataset
- Military insignia
- Third party rights the information provider is not authorised to license
- Other intellectual property rights, including patents, trade marks and design rights
- Identity documents such as the British passport
evidence: The four pages were retrieved on 20 November 2026 by an AI assistant working for the reader. The reuse page is marked last updated 9 December 2022. No saved copy is filed yet; filing is tracked on TEC-746.
notes: GOV.UK's terms say most of its content is Crown copyright and published under the Open Government Licence, and that content which is not is usually credited to its author. The licence allows copying, adapting and commercial use, including in a product or application. GOV.UK gives no attribution statement of its own, so the licence's default statement is used in the attribution line. This record covers what GOV.UK publishes for this body, which is what legal-sources collects. The Office's own website was not read for this record. An AI assistant working for the reader retrieved and read the pages; the reader confirmed the record on 20 November 2026.
