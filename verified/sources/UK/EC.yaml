notes: 'Paused on 24 November 2026: the reader emailed the Electoral Commission that day to ask whether, and on what terms, its content may be reused, read by software and linked to. The Commission acknowledged the email on 25 November 2026 and said the query was being considered; no answer had come by 26 November 2026. Until it answers, nothing from this source is used: no text, no summaries and no links. The upstream sample records and collector in sources/UK/EC/ are upstream''s, not used by this fork''s products. Not yet verified for this register: its website refused automated browsers on 20 and 24 November 2026 with a Cloudflare security check, which was not bypassed, so nobody has read the website''s terms for it and it is link only here. A lead, read on 24 November 2026: the Electoral Commission''s API licence (api.electoralcommission.org.uk/terms) is based on the Open Government Licence 3.0 with amendments, requires the attribution "Contains Electoral Commission Information © Electoral Commission and/or database right", and bars using any automated system to extract content, including data mining and screen scraping. That licence covers the API''s election data, not the enforcement decisions this source collects. legal-sources labels it "ogl-3.0"; that label is a lead, not a finding. A person can settle it by reading the copyright page in their own browser or asking the publisher.'
