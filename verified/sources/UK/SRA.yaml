notes: >-
  Red: the SRA's own terms, not an open licence. legal-sources labels this
  source "ogl-3.0"; none of the pages read mentions the Open Government
  Licence, and the terms of service say material on the website may not be
  reproduced or "used for any public or commercial purposes". Linking needs no
  permission. In legal-sources this source is the SRA's regulatory decisions
  and Solicitors Disciplinary Tribunal decisions, which name individuals, so
  it is also flagged for the data protection check (TEC-763). The Tribunal is
  a separate body with its own website, whose terms were not read for this
  record. The terms for reproducing the Standards and Regulations are a
  separate, notify-first licence; a product that reproduces them relies on
  that licence, not on this record. An AI assistant working for the reader
  retrieved and read the pages; the reader confirmed the record on
  20 November 2026.
