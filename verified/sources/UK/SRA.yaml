conditions:
  - Extracts may be used for review, discussion, academic study and other legitimate pursuits without asking, if the information is used fairly and the source is acknowledged.
  - 'Entire sections of the SRA Standards and Regulations may be reproduced only under their own terms of use: tell the SRA first, by email, which publication they will appear in; use the latest version, accurately, with its version and the date it was taken; and carry the SRA''s notice, which begins "This work is owned by and published under licence from the Solicitors Regulation Authority".'
  - The SRA says it will pursue any use of its material for commercial gain or to misrepresent its regulatory position.
not_covered:
  - Trade marks, service marks and trade names, and the SRA's motifs, designs and logos
  - Rights of third parties, which the SRA does not warrant
