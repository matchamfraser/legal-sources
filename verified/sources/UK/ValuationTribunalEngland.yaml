conditions:
- The site's two pages disagree. The copyright page says its material may be re-used free of charge in any format, and points to the Open Government Licence. The terms of use say the website is for non-commercial, personal use only and that nothing may be reproduced without the Service's written agreement. Until the Service says which governs, commercial use is not recorded as allowed.
- The decisions are about named taxpayers and ratepayers. The data protection check comes before any text is read (TEC-763).
- Where material is re-used it must be accurate, not misleading, and acknowledged as Valuation Tribunal Service copyright with the title of the source document.
