notes: 'Paused on 24 November 2026: the reader emailed IPSO that day to ask whether, and on what terms, its content may be reused, read by software and linked to. Until it replies, nothing from this source is used: no text, no summaries and no links. The upstream sample records and collector in sources/UK/IPSO/ are upstream''s, not used by this fork''s products. Not yet verified for this register: its website refused automated browsers on 20 and 24 November 2026 with a Cloudflare security check, which was not bypassed, so nobody has read this publisher''s terms for it and it is link only here. IPSO is an independent press regulator, not a Crown body, so an Open Government Licence would be unusual. legal-sources labels it "ogl-3.0"; that label is a lead, not a finding. A person can settle it by reading the terms in their own browser or asking the publisher.'
