status_lines:
- Linked, not reproduced.
conditions:
- 'Held at details and a link until the case-law data protection assessment (TEC-763) accepts reading the text: the terms permit it, but rulings name complainants and other people.'
- IPSO asks that each ruling used is linked to the original on its website.
- 'The permission is an email reply, not published terms: "All the rulings published on our website are in the public domain and we have no objection to you using them. ... There are no licences for re-use, and we do not have any credit or acknowledgement conditions." Check at review that it still stands.'
not_covered:
- Material on the website other than the published rulings and resolution statements
- Third-party material quoted in rulings, such as the articles complained about
evidence: The reader's email of 24 November 2026 and IPSO's reply of 26 November 2026, both in the reader's mailbox. Filing of saved copies is tracked on TEC-746.
notes: Verified by asking the publisher. IPSO's website refuses automated browsers and publishes no terms, so the reader emailed IPSO on 24 November 2026; the source was paused until the reply. IPSO's Systems Team replied on 26 November 2026 that the published rulings are in the public domain and that it has no objection to their use, with a link to the original appreciated. IPSO is an independent press regulator, not a Crown body, so the catalogue's Open Government Licence label is not borne out, though the outcome is open. An AI assistant working for the reader read the emails; the reader confirmed the record on 26 November 2026.
signal: yellow
