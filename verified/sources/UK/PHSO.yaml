notes: 'Paused on 24 November 2026: the reader emailed the Parliamentary and Health Service Ombudsman that day to ask whether, and on what terms, its content may be reused, read by software and linked to. Until it replies, nothing from this source is used: no text, no summaries and no links. The upstream sample records and collector in sources/UK/PHSO/ are upstream''s, not used by this fork''s products. Not yet verified for this register: the Ombudsman''s websites were opened in a browser on 20 and 24 November 2026 and have no terms or copyright page that could be found, in their footers, sitemap or publication scheme. The decisions site says real names of individuals are not published, so nobody has read this publisher''s terms for the decisions and it is link only here. A lead, read on 24 November 2026: the Ombudsman''s annual report and accounts 2025 to 2026 (HC 394) says "© Parliamentary and Health Service Ombudsman copyright 2026. This publication is licensed under the terms of the Open Government Licence v3.0 except where otherwise stated"; that statement covers that publication only. legal-sources labels it "ogl-3.0"; that label is a lead, not a finding. A person can settle it by asking the publisher.'
