status_lines:
- Linked, not reproduced.
conditions:
- 'Held at details and a link until the case-law data protection assessment (TEC-763) accepts reading the text: the terms permit it. The decisions site says real names of individuals are not published, but decisions describe individual complaints.'
- 'The Ombudsman asks: "If you reuse or share our content, please quote and link to the source on our website."'
- The Open Government Licence requires the source to be acknowledged, with a link to the licence where possible, and does not cover personal data, third-party rights, or logos and other marks.
- 'The confirmation is an email reply, not a published notice: "All our content is licensed under the Open Government Licence 3.0." Check at review that it still stands.'
not_covered:
- Personal data
- Third-party rights the Ombudsman is not authorised to license
- Logos, crests and other marks
evidence: The reader's email of 24 November 2026 and the Ombudsman's reply of 25 November 2026, both in the reader's mailbox. Filing of saved copies is tracked on TEC-746.
notes: Verified by asking the publisher. The Ombudsman's websites publish no copyright or reuse terms, so the reader emailed it on 24 November 2026; the source was paused until the reply. Its Content Officer replied on 25 November 2026 that all its content is licensed under the Open Government Licence 3.0. The Parliamentary and Health Service Ombudsman has renamed itself the Public Service Ombudsman. Its annual report and accounts 2025 to 2026 (HC 394) carries the same licence. An AI assistant working for the reader read the emails; the reader confirmed the record on 26 November 2026.
signal: yellow
