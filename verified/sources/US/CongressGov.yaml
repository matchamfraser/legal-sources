notes: 'In legal-sources this source is Congressional bills through the Congress.gov API. The Library of Congress says the API lets the public "view, retrieve, and re-use machine-readable data", and offers "Data retrieved from Congress.gov (https://www.congress.gov/)" as an optional citation, used here. Its legal page says it generally does not own the rights to items in its collections. Access: an api.data.gov key is required and the limit is 5,000 requests an hour. The Library''s legal page asks automated programs to make no more than 10 requests a minute to its applications and to honour robots.txt. The Congress.gov website itself runs a bot check, which was not bypassed. An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record and approved the attribution line on 24 November 2026.'
