notes: 'In legal-sources this source is Federal Register documents through the FederalRegister.gov API. GPO''s notice quotes 17 U.S.C. 105 and says: "By virtue of the foregoing, public documents can generally be reprinted without legal restriction. However, Government publications may contain copyrighted material which was used with permission of the copyright owner." FederalRegister.gov and eCFR.gov showed a CAPTCHA to the automated browser, which was not solved. That page says: "Due to aggressive automated scraping of FederalRegister.gov and eCFR.gov, programmatic access to these sites is limited to access to our extensive developer APIs." The APIs answered without a key. The sites'' own legal status and API pages were not read; the record rests on GPO''s notice, under which GPO publishes the official Federal Register and Code of Federal Regulations on GovInfo, including Federal Register and eCFR bulk data, as the reader chose. Access: the API only; no scraping of the website. An AI assistant working for the reader opened the pages in a browser and read them; the reader confirmed the record and approved the attribution line on 24 November 2026.'
